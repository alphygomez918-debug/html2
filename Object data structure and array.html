<!DOCTYPE html>
<html>

<body>
    <h2>My Profile and Favourite Colours</h2>
    <p id="profile"></p>
    <p id="pet"></p>
    <p id="favcolor"></p>
    <p id="before"></p>
    <p id="after"></p>
    <script>
      var student = {
        name: "Alphy",
        age: 14,
        grade: 7,
        hobbies: "playing football",
        "favorite sport": "cricket"
      };
      var colors = ["white", "black", "red", "orange", "blue"];

      document.getElementById("profile").innerHTML = "Name: " + student.name + " Favorite Sport: " + student["favorite sport"];
      document.getElementById("pet").innerHTML = "Pet: " + student.pet;
      document.getElementById("favcolor").innerHTML = " My favourite Color is " + colors[3];
      document.getElementById("before").innerHTML = "Before pop: " + colors.join(" * ") + " (" + colors.length + " colors)";
      colors.pop();
      document.getElementById("after").innerHTML = "After pop: " + colors.join(" * ") + " (" + colors.length + " colors)";
    </script>
</body>

</html>
