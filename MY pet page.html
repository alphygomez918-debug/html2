<!DOCTYPE html>
<html>
<head>
  <title>My pet page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: lightyellow;
      padding: 65px 30px 30px 30px;
      min-height: 1800px;
    }
    h1, h2 { color: darkorange; }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: darkorange;
      color: white;
      padding: 14px 20px;
    }

    .list-item {
      background-color:white;
      border: 2px solid darkorange;
      padding: 10px 20px;
      margin: 5px 0;
    }

    .special-note {
      position: relative;
      left: 30px;
      background-color: gold;
      padding: 10px 20px;
    }

    .pet-card {
      position: relative;
      background-color: white;
      border: 3px solid darkorange;
      padding: 15px 25px;
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: forestgreen;
      color: white;
      padding: 4px 8px;
    }

    .section-label {
      position: sticky;
      top: 55px;
      background-color: darkorange;
      color: white;
      padding: 10px 20px;
      margin: 10px 0 8px;
    }
  </style>
</head>
<body>
 <div class="top-bar">My Pet Page - Buddy the Labrador</div>
 <h1>Meet the buddy!</h1>

 <h2>Static</h2>
 <div class="list-item">Breed: Labrador</div>
 <div class="list-item">Age: 2 years old</div>

 <h2>Relative</h2>
 <p>This note shifts right from its normal spot.</p>
 <div class="special-note">Special Note: Pet of the Month!</div>

 <h2>Absolute</h2>
 <p>The badge is pinned right to the corner.</p>
 <div class="pet-card">
  <p>Buddy - Labrador, 2 years old.</p>
 <div class="badge">Adopted</div>
</div>
