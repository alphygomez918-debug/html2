<!Doctype html>
<html>
<head>
  <title>My game profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: aliceblue;
      text-align: center;
      padding: 30px;
    }
    h1 { color: navy; }
    button {
      background: navy;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    div {
      border: 1px solid navy;
      width: 280px;
      margin: 60px auto;
      padding: 8px 12px;
      text-align: left;
      border-radius: 6px
    }
  </style>
</head>
<body>

  <h1>My Game Profile</h1>
  <button onclick="showProfile()">Show profile</button>

  <div>Name: <span id="name"></span></div> 
  <div>Score: <span id="score"></span></div>
  <div>Top score</div>: <span id="record"></span></div> 
  <div>Rank</div>: <span id="rank"></span></div>
  <div>Greeting</div>: <span id="greeting"></span></div>
  <div>Stars</div>: <span id="stars"></span></div>
  <div>Bonus</div>: <span id="bonus"></span></div>
  <div>Team</div>: <span id="team"></span></div>

  <script>

    function showProfile() {
     
      // Variables
      let name      ="Alex";
      let score     = 75;
      let highscore = 100;
      let bonus     = null;
      let team      

      // Comparison Operator
      let isTopscore = Myscore == highScore;

      // if / else - Rank
      let rank;
      if (myscore >= 80) {
        rank="Gold";
      } else if (myscore >= 50) {
        rank="Silver";
      } else {
        rank="Bronze";
      }

      // Date Object - Greeting
      let hour = new Date().getHours();
      let greeting;
      if (hour < 12) {
        greeting = "Good morning!";
      } else if (hour < 17) {
        greeting = "Good afternoon!";
      } else {
        greeting = "Good evening!";
      }

      // While Loop - stars
      let stars = "";
      let count = "0"
      while (count < 5) {
        stars = stars + "* ";
        count = count + 1;
      }

      // String Concatenation - Show on Page
      document.getElementById("name").innerHTML = name;
      document.getElementById("score").innerHTML = score;
      document.getElementById("record").innerHTML = highscore;
      document.getElementById("rank").innerHTML = rank;
      document.getElementById("greeting").innerHTML = greeting;
      document.getElementById("stars").innerHTML = stars;
      document.getElementById("bonus").innerHTML = bonus;
      document.getElementById("team").innerHTML = team;
    
    }
  
  </script>
</body>
</html>
